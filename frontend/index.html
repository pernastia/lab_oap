<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Техпідтримка для студентів</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" type="module"></script>
  <style>
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
</head>
<body>
  <h1>"Tech support request" for students (варіант №9)</h1>

  <div style="padding: 8px 16px;">
    <label>Current user:</label>
    <select id="currentUserSelect"></select>
  </div>

  <nav class="tabs-menu">
    <button class="tab-btn active" data-tab="tickets">Tickets</button>
    <button class="tab-btn" data-tab="users">Users</button>
    <button class="tab-btn" data-tab="stats">Top 3</button>
  </nav>

  <!-- TICKETS -->
  <div id="tab-tickets" class="tab-panel active">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by subject...">
      <select id="sortSelect">
        <option value="">No sorting</option>
        <option value="priority">Sort by priority</option>
      </select>
    </div>

    <div class="container">
      <div class="form-panel">
        <h2 id="ticketFormTitle">New ticket</h2>
        <form id="ticketForm">
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject">
            <div class="error-text" id="subjectError"></div>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="">select</option>
            </select>
            <div class="error-text" id="statusError"></div>
          </div>
          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="">select</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
            </select>
            <div class="error-text" id="priorityError"></div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message"></textarea>
            <div class="error-text" id="messageError"></div>
          </div>
          <div class="form-group">
            <label for="author">Author</label>
            <select id="author">
              <option value="">select</option>
            </select>
            <div class="error-text" id="authorError"></div>
          </div>
          <button type="submit" id="ticketSubmitBtn">Send</button>
          <div id="ticketAlert" class="alert"></div>
        </form>
        <div id="ticketLoading" style="display:none">Loading...</div>
      </div>

      <div class="list-panel">
        <h2>Ticket list</h2>
        <table>
          <thead>
            <tr>
              <th data-field="id">ID</th>
              <th data-field="subject">Subject</th>
              <th data-field="status">Status</th>
              <th data-field="priority">Priority</th>
              <th data-field="author">Author</th>
              <th data-field="message">Message</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ticketTable"></tbody>
        </table>
        <div id="ticketEmpty" style="display:none">No tickets found</div>
      </div>
    </div>
  </div>

  <!-- USERS -->
  <div id="tab-users" class="tab-panel">
    <div class="container">
      <div class="form-panel">
        <h2 id="userFormTitle">New user</h2>
        <form id="userForm">
          <div class="form-group">
            <label for="userName">User Name</label>
            <input type="text" id="userName">
            <div class="error-text" id="userNameError"></div>
          </div>
          <button type="submit" id="userSubmitBtn">Add user</button>
          <div id="userAlert" class="alert"></div>
        </form>
        <div id="userLoading" style="display:none">Loading...</div>
      </div>
      <div class="list-panel">
        <h2>User list</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="userTable"></tbody>
        </table>
        <div id="userEmpty" style="display:none">No users found</div>
      </div>
    </div>
  </div>

  <!-- TOP 3 -->
  <div id="tab-stats" class="tab-panel">
    <div class="container">
      <div class="list-panel">
        <h2>Top 3 tickets by messages</h2>
        <table>
          <thead>
            <tr>
              <th>Subject</th>
              <th>Messages</th>
              <th>Top User</th>
            </tr>
          </thead>
          <tbody id="topTable"></tbody>
        </table>
      </div>
    </div>
  </div>

</body>
</html>
